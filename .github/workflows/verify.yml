name: Verify

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  statistics:
    # Rebuilds the reference results with current networkx and statsmodels, tests the engine against
    # them, runs every generated script on data with a known effect, runs the engine on real data with
    # an experimental benchmark, and measures what the assumptions panel claims across simulated studies.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      - name: Install dependencies
        run: |
          npm ci
          pip install -r tools/verification/requirements.txt dowhy causaldata

      - name: Typecheck
        run: npm run typecheck

      - name: Refresh reference results
        run: python tools/verification/generate_golden.py

      - name: Test engine against reference results
        run: npm test

      - name: Run generated code against known effects
        run: python tools/verification/verify_generated_code.py

      - name: Run the engine on LaLonde's data
        run: python tools/verification/verify_lalonde.py

      - name: Measure the assumptions panel across simulated studies
        run: npm run verify:calibration -- 100
